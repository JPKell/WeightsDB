[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weightsdb"
description = "Shared SQLAlchemy + Alembic plumbing: engines, sessions, pragmas, migrations, backup and health. No application table, no shared schema."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "Local AI Suite contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "baseaicore>=0.4,<0.5",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
dev = [
    # The PostgreSQL driver is a *test* dependency as well as an optional runtime one: seventeen
    # tests assert dialect-specific behaviour (JSONB type binding, the connect listener, pg_dump
    # command construction, the health probes' off-SQLite branches) by building a `postgresql://`
    # engine, which SQLAlchemy cannot do without an importable DBAPI — no server involved. Without
    # it here, those tests fail with ModuleNotFoundError in any environment that installs `[dev]`
    # alone, and coverage lands at 88% against a 95% floor.
    "psycopg[binary]>=3.2,<4",
    # >=9.0.3 excludes PYSEC-2026-1845 (vulnerable /tmp/pytest-of-{user} handling,
    # affecting pytest through 9.0.2). Matches the pin BaseAiCore, SetSpec, ModelRack and
    # SweatMeter already moved to.
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<6",
    "pytest-randomly>=3,<4",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "import-linter>=2.0,<3",
    "respx>=0.21,<1",
]

[project.urls]
Homepage = "https://github.com/JPKell/WeightsDB"
Documentation = "https://github.com/JPKell/WeightsDB/tree/main/docs"
Changelog = "https://github.com/JPKell/WeightsDB/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/weightsdb/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/weightsdb"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "T20", "DTZ", "PTH", "D1", "BLE"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-m 'not live and not performance'"
markers = [
    "live: requires a real provider/GPU, never in default CI",
    "performance: performance budget assertions, excluded by default",
    "contract: public API/schema conformance in both directions",
]
testpaths = ["tests"]

[tool.coverage.run]
# The importable name, not the source path: CI installs the built distribution rather than an
# editable checkout (Packaging Standards §4), so coverage must find the package wherever it is
# installed. `paths` folds the two locations into one name in the report.
source = ["weightsdb"]
branch = true

[tool.coverage.paths]
source = ["src/weightsdb", "*/site-packages/weightsdb"]

[tool.coverage.report]
fail_under = 95
show_missing = true
